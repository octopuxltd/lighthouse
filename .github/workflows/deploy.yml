name: CI and deploy

# On every push to main: run tests, lint and type check as independent jobs,
# and deploy to Cloudflare only if all three pass.
on:
  push:
    branches: [main]

# One deploy at a time; a newer push cancels an in-flight run.
concurrency:
  group: deploy-workers
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  deploy:
    # Only deploy if tests, lint and the type check all pass.
    needs: [test, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4 requires Node >= 22.
          node-version: 22
          cache: npm
      - run: npm ci

      # Apply any pending D1 migrations before deploying, so the schema the new
      # code expects is already in place.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply lighthouse-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Build the Next app, adapt it for Workers with OpenNext, and deploy.
      # opennextjs-cloudflare deploy runs `wrangler deploy` under the hood,
      # reading auth from the two Cloudflare env vars below.
      - name: Build and deploy (OpenNext)
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
