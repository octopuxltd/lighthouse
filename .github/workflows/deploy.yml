name: Deploy to Cloudflare Workers

# Deploy on every push to main.
on:
  push:
    branches: [main]

# Allow one deploy at a time; a newer push cancels an in-flight run.
concurrency:
  group: deploy-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install exactly what package-lock.json pins.
      - run: npm ci

      # Build the Next app, adapt it for Workers with OpenNext, and deploy.
      # opennextjs-cloudflare deploy runs `wrangler deploy` under the hood,
      # reading auth from the two Cloudflare env vars below.
      - name: Build and deploy (OpenNext)
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
